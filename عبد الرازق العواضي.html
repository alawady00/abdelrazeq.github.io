/* Layout concept: navy bands (header, hero, footer) frame ivory reading pages; arch-framed portrait, faint letterforms, gold hairlines */
:root{
  --navy:#061230; --navy-2:#0D2552; --gold:#A9DBF9; --gold-deep:#4EA9DD; --sky:#38B6F5; --ivory:#F1F5FC;
  --bg:#071433; --surface:rgba(22,48,104,.46); --surface-2:rgba(255,255,255,.035); --ink:#EEF3FC; --muted:#A9B9D6;
  --line:rgba(170,195,240,.20); --gold-text:#7CCBF7; --focus:#5CC8FF; --ok:#6FD3A0; --bad:#FF9C9C;
  --f-display:'Aref Ruqaa','Amiri','Traditional Arabic',serif; --f-head:'Amiri','Traditional Arabic','Noto Naskh Arabic',serif;
  --f-body:'IBM Plex Sans Arabic','Segoe UI',Tahoma,'Noto Sans Arabic',sans-serif; --photo-bg:#0D2552;
  --r:24px; --r-m:18px; --r-s:14px; color-scheme:dark;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:radial-gradient(1100px 700px at 85% -10%,#17488F 0,transparent 60%),radial-gradient(800px 600px at 0% 100%,rgba(56,182,245,.20) 0,transparent 60%),var(--bg);background-attachment:fixed;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.8;direction:rtl;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--navy);z-index:60}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:var(--logo,none) 50% 52%/min(86vmin,780px) no-repeat;opacity:.075;animation:float 22s ease-in-out infinite alternate}
@keyframes float{from{transform:translateY(-8px) scale(1)}to{transform:translateY(10px) scale(1.025)}}
#app{position:relative;z-index:1}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:1140px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{font-family:var(--f-head);line-height:1.35;text-wrap:balance;margin:0}
p{margin:0}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:8px 22px;border:1.5px solid transparent;border-radius:999px;font-weight:600;font-size:15.5px;text-decoration:none;cursor:pointer;background:none;transition:transform .15s,background .15s}
.btn:hover{transform:translateY(-1px)}
.btn.gold{background:linear-gradient(135deg,#E6F6FF,#6CC6F7);color:var(--navy);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.btn.gold:hover{background:linear-gradient(135deg,#FFFFFF,#9ADAFB)}
.btn.line{border-color:currentColor}
.btn.on-navy{color:var(--ivory)}
.btn.sm{min-height:38px;padding:4px 16px;font-size:14.5px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-s{min-height:40px;padding:4px 14px;border:1px solid rgba(191,208,238,.4);border-radius:999px;background:rgba(255,255,255,.04);color:var(--ivory);cursor:pointer;font-size:14.5px}
.btn-s:hover{background:rgba(247,243,234,.1)}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(6,18,48,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--ivory);border-bottom:1px solid var(--line)}
.hdr-in{display:flex;align-items:center;gap:16px;min-height:66px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;min-width:0}
.seal{flex:none;width:48px;height:48px;border-radius:50%;background:var(--navy-2);display:block;padding:2px;background:linear-gradient(135deg,#E6F6FF,#38B6F5);overflow:hidden}
.seal img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:center 18%;display:block}
.brand-t{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.brand-t b{font-family:var(--f-head);font-size:19px;white-space:nowrap}
.brand-t small{font-family:var(--f-display);color:var(--gold);font-size:15px}
.nav{display:none;margin-inline:auto;gap:2px}
.nav a{padding:8px 11px;text-decoration:none;font-size:15px;border-bottom:2px solid transparent;white-space:nowrap}
.nav a:hover,.nav a.on{border-color:var(--gold);color:var(--gold)}
.hdr-act{display:flex;gap:8px;margin-inline-start:auto}
@media(min-width:1120px){.nav{display:flex}.menu-btn{display:none}.hdr-act{margin-inline-start:0}}
@media(max-width:380px){.brand-t b{font-size:16px}}

.notice{background:linear-gradient(90deg,#9CB6E8,#D6E3F8);color:var(--navy);font-weight:600}
.notice .wrap{padding-block:10px;text-align:center}

/* hero */
.hero{background:linear-gradient(180deg,rgba(13,37,82,.55),rgba(6,18,48,.15));color:var(--ivory);position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.hero-in{position:relative;display:grid;grid-template-columns:minmax(0,1fr);gap:36px;padding-block:44px 56px;align-items:center}
.hero-photo{order:-1;position:relative;width:min(290px,76%);margin-inline:auto;aspect-ratio:1}
.arch{position:absolute;inset:0;border-radius:50%;padding:5px;background:linear-gradient(145deg,#EAF1FE,#38B6F5 55%,#C6D6F3);box-shadow:0 24px 70px rgba(0,0,0,.45),0 0 0 14px rgba(56,182,245,.10)}
.arch img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:center 16%;display:block;background:var(--photo-bg)}
.orbit{position:absolute;inset:-26px;border-radius:50%;border:1px dashed rgba(191,208,238,.38);animation:spin 60s linear infinite}
.orbit i{position:absolute;top:50%;inset-inline-end:-6px;width:12px;height:12px;border-radius:50%;background:linear-gradient(145deg,#fff,#38B6F5);box-shadow:0 0 20px #38B6F5}
@keyframes spin{to{transform:rotate(360deg)}}
.eyebrow{font-size:14px;letter-spacing:.08em;color:var(--gold);font-weight:500;display:flex;align-items:center;gap:12px}
.eyebrow::after{content:"";height:1px;width:56px;background:linear-gradient(to left,var(--gold),transparent)}
.hero h1{font-size:clamp(38px,8vw,68px);margin-top:10px;line-height:1.2;background:linear-gradient(100deg,#FFFFFF,#D3EEFD 55%,#6CC6F7);-webkit-background-clip:text;background-clip:text;color:transparent}
.slogan{font-family:var(--f-display);font-size:clamp(40px,9vw,76px);line-height:1.25;margin-top:4px;background:linear-gradient(100deg,#FFFFFF,#9ADAFB 60%,#8FB2FF);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{margin-top:14px;font-size:clamp(16px,2.2vw,18.5px);max-width:56ch;color:rgba(247,243,234,.88)}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}
.hsearch{display:flex;margin-top:22px;max-width:min(460px,100%);border-radius:999px;overflow:hidden;border:1px solid rgba(191,208,238,.4);background:rgba(255,255,255,.06)}
.hsearch input{flex:1;min-width:0;min-height:48px;padding:0 20px;background:none;border:0;color:var(--ivory)}
.hsearch input::placeholder{color:rgba(247,243,234,.65)}
.hsearch button{min-height:48px;padding:0 24px;background:linear-gradient(135deg,#E6F6FF,#6CC6F7);color:var(--navy);border:0;font-weight:600;cursor:pointer}
@media(min-width:860px){.hero-in{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);padding-block:72px 88px}.hero-photo{order:0;width:min(400px,100%)}}

/* sections */
.band{padding-block:56px}
.band.alt{background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.015));border-block:1px solid var(--line)}
.sec-h{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px;margin-bottom:26px}
.h2{font-size:clamp(26px,4vw,36px)}
.kash{display:block;height:3px;width:90px;margin-top:10px;background:linear-gradient(to left,var(--gold-deep),transparent)}
.sub{color:var(--muted);max-width:60ch;margin-top:8px}
.more{color:var(--gold-text);font-weight:600;text-decoration:none;border-bottom:1px solid currentColor}

.tiles{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}.hero-in>*,.today>*,.about>*,.play-grid>*{min-width:0}
.tile{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:8px;min-height:190px;padding:26px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(8px);text-decoration:none;transition:transform .2s,border-color .2s}
.tile:hover{transform:translateY(-4px);border-color:var(--gold-deep);box-shadow:0 18px 40px rgba(0,0,0,.3)}
.tile .g{position:absolute;inset-inline-end:14px;top:-18px;font-family:var(--f-head);font-weight:700;font-size:150px;line-height:1;color:var(--gold);opacity:.09;pointer-events:none}
.tile h3{font-size:26px;position:relative}
.tile p{color:var(--muted);font-size:15px;position:relative;max-width:30ch}
.tile .go{margin-top:auto;color:var(--gold-text);font-weight:600;position:relative}
.cnt{font-size:13px;color:var(--gold-text);font-weight:600;position:relative}

.today{display:grid;gap:20px}
@media(min-width:860px){.today{grid-template-columns:1fr 1.2fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:28px;backdrop-filter:blur(8px)}
.tag{font-size:13.5px;font-weight:600;color:var(--gold-text);letter-spacing:.05em;display:flex;align-items:center;gap:10px}
.tag::before{content:"";width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,#fff,#38B6F5)}
.word .w{font-family:var(--f-head);font-size:clamp(44px,8vw,64px);color:var(--ink);margin-top:8px;line-height:1.2}
.word .m{font-size:18px;margin-top:6px}
.word .ex{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-family:var(--f-head);font-size:19px}
.q{font-family:var(--f-head);font-size:22px;margin:12px 0 14px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;min-height:50px;padding:8px 14px;text-align:start;background:rgba(255,255,255,.05);border:1.5px solid var(--line);border-radius:var(--r-m);cursor:pointer;font-size:16.5px;width:100%}
.opt:hover:not([disabled]){border-color:var(--gold-deep)}
.opt i{flex:none;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:13px;color:var(--muted)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--bg))}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--bg))}
.opt[disabled]{cursor:default}
.res{margin-top:12px;font-weight:600}
.res.ok{color:var(--ok)}.res.no{color:var(--bad)}

.cols3{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.col h3{font-size:22px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.li{display:block;padding:12px 0;border-bottom:1px solid var(--line);text-decoration:none}
.li b{display:block;font-weight:600}
.li small{color:var(--muted)}
.li:hover b{color:var(--gold-text)}
.soft{color:var(--muted);font-size:15px}

.slot{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:20px;overflow:hidden;backdrop-filter:blur(8px);display:flex;flex-direction:column;gap:8px;min-width:0}
.card h3{font-size:22px}
.badge{display:inline-block;align-self:flex-start;padding:1px 10px;font-size:13px;font-weight:600;border:1px solid var(--gold-deep);color:var(--gold-text);border-radius:999px}
.meta{font-size:14px;color:var(--muted)}
.card .btn{margin-top:auto;align-self:flex-start}
.thumb{aspect-ratio:16/10;margin:-20px -20px 8px;background:linear-gradient(135deg,#0D2552,#173B7E);display:grid;place-items:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb span{font-family:var(--f-head);font-weight:700;font-size:96px;color:var(--gold);opacity:.85;line-height:1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:15.5px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:38px;padding:2px 16px;background:var(--surface);border:1px solid var(--line);border-radius:999px;cursor:pointer;font-size:14.5px}
.chip.on{background:linear-gradient(135deg,#E6F6FF,#6CC6F7);color:var(--navy);border-color:transparent;font-weight:600}
.ctl{display:grid;gap:12px;margin-bottom:22px}
.ctl small{color:var(--muted);margin-inline-end:6px}
.field-search{min-height:46px;width:100%;max-width:420px;padding:0 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s)}
.empty{padding:36px 20px;border:1px dashed var(--line);border-radius:var(--r-m);background:rgba(255,255,255,.025);text-align:center;color:var(--muted);display:grid;gap:14px;justify-items:center}
.page-h{background:linear-gradient(180deg,rgba(13,37,82,.6),rgba(6,18,48,.1));border-bottom:1px solid var(--line);color:var(--ivory);padding-block:44px;position:relative;overflow:hidden}
.page-h::after{content:attr(data-g);position:absolute;inset-inline-end:4%;top:-30%;font-family:var(--f-head);font-weight:700;font-size:260px;line-height:1;color:var(--gold);opacity:.07}
.page-h .wrap{position:relative}
.page-h h1{font-size:clamp(30px,5vw,44px)}
.page-h p{color:rgba(247,243,234,.85);margin-top:8px;max-width:60ch}
.page-b{padding-block:36px 64px;min-height:50vh}
.bar{height:8px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(to left,#2EA8F0,#DDF3FF)}
.stats{display:flex;flex-wrap:wrap;gap:24px;align-items:end}
.stats .n{font-family:var(--f-head);font-size:48px;line-height:1}
.play-grid{display:grid;gap:20px;margin-bottom:28px}
@media(min-width:860px){.play-grid{grid-template-columns:1.6fr 1fr}}
.quote{font-family:var(--f-head);font-size:clamp(24px,4vw,34px);line-height:1.6;text-wrap:balance}
.about{display:grid;gap:32px}
@media(min-width:860px){.about{grid-template-columns:1fr 1.5fr;align-items:start}}
.about .arch{position:relative;inset:auto;max-width:340px;aspect-ratio:1;margin-inline:auto}
.about-t p{margin-top:12px}
.about h3{font-size:24px;margin-top:26px}
.links{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.copy-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:10px}
.copy-row code{font-family:var(--f-body);direction:ltr;padding:6px 12px;background:var(--surface-2);border-radius:var(--r-s);user-select:all}
details.d{border-top:1px solid var(--line);padding-top:8px}
details.d summary{cursor:pointer;font-weight:600;color:var(--gold-text);min-height:34px;display:flex;align-items:center}
details.d p{white-space:pre-line;font-size:15.5px}

/* footer */
.ftr{background:rgba(6,18,48,.8);backdrop-filter:blur(10px);color:var(--ivory);padding-block:40px 28px;margin-top:0;border-top:1px solid var(--line);border-radius:var(--r) var(--r) 0 0}
.ftr-in{display:grid;gap:26px}
@media(min-width:860px){.ftr-in{grid-template-columns:1.4fr 1fr 1fr}}
.ftr .quote{font-size:22px;color:var(--gold)}
.ftr ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.ftr a{text-decoration:none}.ftr a:hover{color:var(--gold)}
.ftr h4{font-size:18px;margin-bottom:10px;color:var(--gold)}
.copy{margin-top:26px;padding-top:16px;border-top:1px solid rgba(247,243,234,.18);font-size:14px;color:rgba(247,243,234,.7);display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between}

/* overlays */
.ov{position:fixed;inset:0;z-index:70;background:rgba(4,12,32,.95);backdrop-filter:blur(10px);color:var(--ivory);overflow-y:auto;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.ov-in{max-width:760px;margin-inline:auto}
.ov-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.mlink{display:flex;align-items:center;justify-content:space-between;padding:16px 4px;border-bottom:1px solid rgba(247,243,234,.16);text-decoration:none;font-family:var(--f-head);font-size:24px}
.mlink:hover{color:var(--gold)}
.sbox{width:100%;min-height:54px;padding:0 22px;border-radius:999px!important;font-size:18px;background:rgba(247,243,234,.1);border:1px solid rgba(247,243,234,.4);border-radius:var(--r-s);color:var(--ivory)}
.sres{margin-top:16px;display:grid;gap:4px}
.sr{display:block;padding:12px 8px;border-bottom:1px solid rgba(247,243,234,.14);text-decoration:none;cursor:pointer;text-align:start;background:none;border-inline:0;border-top:0;color:inherit;width:100%}
.sr:hover{background:rgba(247,243,234,.07)}
.sr small{color:var(--gold);margin-inline-end:8px}
.sr span{display:block;color:rgba(247,243,234,.7);font-size:14.5px}
.reader{background:#0C2150;border:1px solid var(--line);border-radius:var(--r)!important;color:var(--ink);padding:28px;border-radius:var(--r-s);margin-top:10px}
.reader h2{font-size:30px}
.reader p{margin-top:14px;font-size:18px}

/* admin */
.adm{position:fixed;inset:0;z-index:80;background:rgba(6,16,36,.7);display:flex;justify-content:flex-start}
.adm-p{background:#081A40;border-inline-start:1px solid var(--line);color:var(--ink);width:min(780px,100%);height:100%;overflow-y:auto;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(28px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:0 0 40px rgba(0,0,0,.4)}
.adm-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.adm-top h2{font-size:28px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:20px}
.tab{flex:none;min-height:42px;padding:2px 16px;background:none;border:0;border-bottom:3px solid transparent;cursor:pointer;font-weight:600}
.tab.on{border-color:var(--sky);color:var(--gold-text)}
.ahead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:22px 0 10px}
.ahead h3{font-size:22px}
.row{display:flex;gap:10px;align-items:center}
.arow{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.arow div{min-width:0}
.arow b{display:block;overflow-wrap:anywhere}
.arow small{color:var(--muted)}
.acts{display:flex;gap:6px;flex:none}
.btn.dng{border-color:var(--bad);color:var(--bad)}
.fld{display:grid;gap:6px;margin-bottom:16px}
.fld label{font-weight:600;font-size:15px}
.fld input[type=text],.fld select,.fld textarea{width:100%;min-height:44px;padding:8px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);color:var(--ink)}
.fld textarea{resize:vertical}
.fld small{color:var(--muted)}
.fld input[dir=ltr]{text-align:left}
.up{cursor:pointer;display:inline-flex;align-items:center;min-height:44px;padding:2px 14px;border:1px solid var(--gold-deep);color:var(--gold-text);font-weight:600;font-size:14.5px;border-radius:var(--r-s);flex:none;position:relative}
.up input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.prev{width:120px;aspect-ratio:16/10;object-fit:cover;border:1px solid var(--line);display:block}
.fbar{display:flex;gap:10px;position:sticky;bottom:0;background:#081A40;padding-block:12px;border-top:1px solid var(--line);margin-top:8px}
.chk{display:flex;gap:10px;align-items:center}
.chk input{width:22px;height:22px}
.hint{background:rgba(255,255,255,.05);border-radius:var(--r-m);border-inline-start:3px solid var(--gold-deep);padding:12px 16px;margin-bottom:16px;font-size:15px}
.fab{border-radius:999px;position:fixed;z-index:45;inset-inline-start:max(16px,env(safe-area-inset-left,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));box-shadow:0 8px 24px rgba(0,0,0,.35)}
#toast{position:fixed;z-index:100;left:50%;bottom:max(24px,env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#0C2150;color:var(--ivory);border:1px solid var(--gold-deep);padding:12px 22px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
select option{background:#0C2150;color:#EEF3FC}
.ed{cursor:pointer;outline:1px dashed rgba(124,203,247,.6);outline-offset:3px;border-radius:4px}
.ed:hover{background:rgba(92,200,255,.2)}
.fabs{position:fixed;z-index:45;inset-inline-start:max(16px,env(safe-area-inset-left,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.fabs .btn{box-shadow:0 8px 24px rgba(0,0,0,.35)}
.ebar{position:fixed;z-index:90;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;background:#0C2150;border:1px solid var(--gold-deep);border-radius:26px;padding:10px 16px;width:max-content;max-width:calc(100% - 24px);box-shadow:0 12px 36px rgba(0,0,0,.5);font-size:14.5px}
.ebar select{min-height:38px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--line);padding:0 12px;color:var(--ink)}
.emod{position:fixed;inset:0;z-index:95;background:rgba(4,12,32,.82);display:grid;place-items:center;padding:16px}
.emod-in{background:#0A1B3F;border:1px solid var(--line);border-radius:var(--r);padding:24px;width:min(560px,100%);max-height:90vh;overflow:auto}

</style><div id="app" dir="rtl" lang="ar"><header id="hdr" class="hdr"></header><div id="notice"></div><main id="view"></main><footer id="ftr" class="ftr"></footer><div id="ovl"></div><div id="adm"></div><div id="fabw"></div><div id="toast" role="status" aria-live="polite"></div></div><script id="site-data" type="application/json">{"profile":{"name":"عبد الرازق العواضي","short":"عبد الرازق العواضي","title":"أستاذ اللغة العربية","slogan":"التعليم رسالة .. والرسالة أمانة .. والأمانة غايتنا","mission":"أُعلّم العربية لتُحَبَّ قبل أن تُحفَظ. أصحب طلابي في النحو والإعراب والبلاغة والنصوص والتعبير، خطوةً بعد خطوة، حتى يقرؤوا لغتهم بثقة ويكتبوها باعتزاز.","bio":"عبد الرازق الشحات العواضي\n\nمعلّم اللغة العربية | صانع الأوائل\n\nأنا عبد الرازق الشحات العواضي، خريج كلية اللغة العربية بالمنصورة – الشعبة العامة، أحمل شغفًا باللغة العربية، وإيمانًا راسخًا بأن التعليم رسالة تتجاوز حدود الكتاب والشرح؛ فهو بناءٌ للعقول، وصناعةٌ للوعي، وغرسٌ للقيم.\n\nحرصتُ على تطوير خبراتي العلمية والتربوية، فالتحقتُ بالعديد من الدورات المتخصصة والمعتمدة في التربية وتكنولوجيا التعليم من جامعة المنصورة، من أبرزها دورة الخبير التعليمي، كما تلقيتُ دورات متخصصة في تكنولوجيا التعليم والنحو والبلاغة من المركز الجامعي الدولي التابع لشركة Microsoft.\n\nوفي مجال التأليف والتطوير التعليمي، أعددتُ سلسلة «الخلاصة» في النحو والبلاغة لطلاب المرحلتين الإعدادية والثانوية، سعيًا إلى تقديم المادة العلمية بأسلوب يجمع بين الدقة والوضوح، ويقرّب المعلومة إلى أذهان الطلاب، ويعينهم على الفهم العميق واستبقاء المعرفة.\n\nولأنني أؤمن بأن التعليم يتطور بالابتكار، لم أحصر جهودي في الأساليب التقليدية، بل اتجهتُ إلى تصميم وابتكار الألعاب التعليمية المتخصصة في الإعراب، وإنشاء موقع تعليمي لتيسير تعلمه، إلى جانب ابتكار ألعاب تستهدف تنمية القدرات العقلية، وتعزيز الذاكرة، وتنشيط التفكير والتركيز لدى الأطفال والكبار.\n\nكما أسستُ سنتر عمرو عبد المعطي، ليكون مساحة تعليمية تقوم على الاهتمام بالطالب علميًّا وتربويًّا، وتقديم تجربة تعليمية أكثر تطورًا وفاعلية.\n\nأطمح دائمًا إلى أن أكون صاحب أثرٍ يتجاوز حدود الحصة الدراسية، وأن أُسهم في تقديم جيلٍ واعٍ، مثقفٍ، متمكنٍ من لغته، معتزٍّ بهويته، متفوقٍ في علمه وأخلاقه.\n\nأؤمن أن التعليم رسالة، والرسالة أمانة، والأمانة غايتنا.","philosophy":"التعليم رسالة.. والرسالة أمانة.. والأمانة غايتنا","experience":"حرصتُ على تطوير خبراتي العلمية والتربوية، فالتحقتُ بالعديد من الدورات المتخصصة والمعتمدة في التربية وتكنولوجيا التعليم من جامعة المنصورة، من أبرزها دورة الخبير التعليمي، كما تلقيتُ دورات متخصصة في تكنولوجيا التعليم والنحو والبلاغة من المركز الجامعي الدولي التابع لشركة Microsoft.\n\nوفي مجال التأليف والتطوير التعليمي، أعددتُ سلسلة «الخلاصة» في النحو والبلاغة لطلاب المرحلتين الإعدادية والثانوية، سعيًا إلى تقديم المادة العلمية بأسلوب يجمع بين الدقة والوضوح، ويقرّب المعلومة إلى أذهان الطلاب، ويعينهم على الفهم العميق واستبقاء المعرفة.\n\nولأنني أؤمن بأن التعليم يتطور بالابتكار، لم أحصر جهودي في الأساليب التقليدية، بل اتجهتُ إلى تصميم وابتكار الألعاب التعليمية المتخصصة في الإعراب، وإنشاء موقع تعليمي لتيسير تعلمه، إلى جانب ابتكار ألعاب تستهدف تنمية القدرات العقلية، وتعزيز الذاكرة، وتنشيط التفكير والتركيز لدى الأطفال والكبار.\n\nكما أسستُ سنتر عمرو عبد المعطي، ليكون مساحة تعليمية تقوم على الاهتمام بالطالب علميًّا وتربويًّا، وتقديم تجربة تعليمية أكثر تطورًا وفاعلية.","whatsapp":"01009125586","email":"","facebook":"https://www.facebook.com/share/14vfq9REe8s/","youtube":"","instagram":"","telegram":"https://web.telegram.org/a/","tiktok":"https://www.tiktok.com/@abdelrazeq13?_r=1&_t=ZS-9BbJ9H8730X"},"notice":{"on":false,"text":""},"texts":{},"lessons":[],"files":[{"id":"mwqz5ewfxhf1","date":"2026-11-21T22:23:24.591Z","title":"الخلاصة في البلاغة للصف الأول الثانوي _ التيرم الأول.","kind":"","url":"","desc":"أُعِدَّ هذا الملخص بعناية، مستندًا إلى أحدث استراتيجيات التعلُّم وأساليبه، ليُيسِّر الفهم، ويُرسِّخ المعلومات في الذهن، ويعين على استدعائها بثبات على المدى البعيد. وأسأل الله أن يجعل فيه نفعًا وعلمًا مباركًا، وأن لا تنسوني من صالح دعائكم. ❤️"},{"id":"mwqz2w9znhpo","date":"2026-11-21T22:21:27.143Z","title":"الخلاصة في النحو للصف الأول الثانوي _ التيرم الأول.","kin function level(p){var i=0;LV.forEach(function(x,j){if(p>=x[0])i=j});var nx=LV[i+1];return{name:LV[i][1],next:nx?nx[0]:null,base:LV[i][0],nname:nx?nx[1]:''}}
function dayNum(){var d=new Date();return Math.floor(new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime()/864e5)}
function todayKey(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function rng(seed){var s=seed%2147483647;if(s<=0)s+=2147483646;return function(){s=s*16807%2147483647;return(s-1)/2147483646}}
function shuffle(a,r){r=r||Math.random;for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

  return '<!doctype html>\n<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>'+TITLE+'</title><meta name="description" content="'+esc(desc)+'"><meta property="og:title" content="'+TITLE+'"><meta property="og:description" content="'+esc(desc)+'"><meta name="theme-color" content="#0B1E3F"><link rel="icon" href="'+IMG.logo+'">'
   +'<style id="site-css">'+$('#site-css').textContent+'</style><style>:root{color-scheme:dark;background:#071433}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>'
   +'<noscript><p style="padding:24px;font:20px sans-serif;direction:rtl">يحتاج هذا الموقع إلى تفعيل JavaScript في المتصفح.</p></noscript>'
   +'<div id="app" dir="rtl" lang="ar"><header id="hdr" class="hdr"></header><div id="notice"></div><main id="view"></main><footer id="ftr" class="ftr"></footer><div id="ovl"></div><div id="adm"></div><div id="fabw"></div><div id="toast" role="status" aria-live="polite"></div></div>'
   +'<script id="site-data" type="application/json">'+j(JSON.stringify(d))+'<\/script><script id="site-imgs" type="application/json">'+$('#site-imgs').textContent+'<\/script><script id="site-js">'+$('#site-js').textContent+'<\/script></body></html>'}
function downloadSite(){
  try{var html=buildStandalone(JSON.parse(JSON.stringify(data)));var b=new Blob([html],{type:'text/html;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='index.html';document.body.appendChild(a);a.click();a.remove();
    try{localStorage.setItem('ds_data',JSON.stringify({saved:Date.now(),data:data}))}catch(e){}
    toast('تم تنزيل الملف index.html. ارفعه مكان القديم في الاستضافة.')}catch(e){toast('تعذّر تجهيز الملف')}}
function buildDoc(d){
  var hs=$('head style'),reset=(hs&&/safe-area-inset-top/.test(hs.textContent))?hs.textContent:RESET;
  var j=function(s){return s.replace(/</g,'\\u003c')};
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'
   +'<title>'+TITLE+'</title><meta name="claude:viewport-fit-sides" content="cover">'+'<style id="site-css">'+$('#site-css').textContent+'</style>'
   +'<div id="app" dir="rtl" lang="ar"><header id="hdr" class="hdr"></header><div id="notice"></div><main id="view"></main><footer id="ftr" class="ftr"></footer><div id="ovl"></div><div id="adm"></div><div id="fabw"></div><div id="toast" role="status" aria-live="polite"></div></div>'
   +'<script id="site-data" type="application/json">'+j(JSON.stringify(d))+'<\/script><script id="site-imgs" type="application/json">'+$('#site-imgs').textContent+'<\/script><script id="site-js">'+$('#site-js').textContent+'<\/script></body></html>'}
function commit(mut,msg){
  var next=JSON.parse(JSON.stringify(data));mut(next);
  if(!ART){var ok=true;try{next._saved=Date.now();localStorage.setItem('ds_data',JSON.stringify({saved:next._saved,data:next}))}catch(e){ok=false}
    data=next;AD.form=null;AD.del=null;renderAll();
    toast(ok?'تم الحفظ على هذا الجهاز. لنشره للجميع نزّل نسخة الموقع من لوحة التحكم.':'تعذّر الحفظ على هذا الجهاز (المساحة ممتلئة). نزّل نسخة الموقع الآن.');return Promise.resolve(true)}
  AD.busy=true;renderAdmin();
  return ART.publish(buildDoc(next)).then(function(){data=next;AD.busy=false;AD.form=null;AD.del=null;renderAll();toast(msg);return true},function(e){
    AD.busy=false;renderAdmin();var c=e&&e.code;
    toast(c==='conflict'?'تعدّل الموقع من نافذة أخرى. حدّث الصفحة ثم أعد المحاولة.':(c==='not_granted'||c==='not_writer')?'ليست لديك صلاحية تعديل هذا الموقع.':'تعذّر الحفظ. حاول مرة أخرى.');return false})}
function collect(form){var o={};$$('[data-k]',form).forEach(function(e){o[e.dataset.k]=e.type==='checkbox'?e.checked:e.value.trim()});return o}
function saveForm(form){
  var col=form.dataset.col,id=form.dataset.id,c=COLS[col],v=collect(form);
  for(var i=0;i<c.f.length;i++){var f=c.f[i];if(f.req&&!v[f.k]){toast('أكمل الحقل المطلوب: '+f.l);var e=$('#f_'+f.k);if(e)e.focus();return}}
  if(col==='games'||col==='files'||col==='lessons'){if(v.url&&!url(v.url)){toast('الرابط غير صالح');return}}
  commit(function(d){
    if(c.single){d[col]=Object.assign({},d[col],v)}
    else if(id){d[col]=d[col].map(function(x){return x.id===id?Object.assign({},x,v):x})}
    else{d[col].unshift(Object.assign({id:uid(),date:new Date().toISOString()},v))}
  },id||c.single?'تم الحفظ ونُشر التعديل':'تمت الإضافة ونُشرت')}
function shrink(f,cb,fail){var im=new Image(),u=URL.createObjectURL(f);im.onload=function(){var m=900,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);var o=c.toDataURL('image/webp',.82);if(o.indexOf('image/webp')<0)o=c.toDataURL('image/jpeg',.82);cb(o)};im.onerror=fail;im.src=u}
function upload(inp){var f=inp.files&&inp.files[0];if(!f)return;var id=inp.dataset.up,st=$('#'+id+'_s');
  if(STANDALONE){if(!inp.dataset.img){$('#'+id).value='files/'+f.name;if(st)st.textContent='تم تسجيل المسار. ارفع الملف «'+f.name+'» إلى مجلد اسمه files بجانب index.html في موقع الاستضافة.';return}if(st)st.textContent='جارٍ تجهيز الصورة…';shrink(f,function(o){$('#'+id).value=o;var p=$('#'+id+'_p');p.src=o;p.hidden=false;if(st)st.textContent='تم تجهيز الصورة'},function(){if(st)st.textContent='تعذّر قراءة الصورة'});return}
  if(!ASSETS)return;
  if(f.size>20*1024*1024){toast('الحجم الأقصى للملف ٢٠ ميجابايت');return}
  if(st)st.textContent='جارٍ الرفع…';
  ASSETS.upload(f).then(function(r){var t=$('#'+id);t.value=r.url;if(st)st.textContent='تم رفع: '+f.name;if(inp.dataset.img){var p=$('#'+id+'_p');p.src=r.url;p.hidden=false}},function(){if(st)st.textContent='تعذّر الرفع، حاول مرة أخرى.'})}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;var a=t.dataset.act;
  if(a==='menu-open'){OV.menu=true;OV.search=false;renderOverlay()}
  else if(a==='search-open'){OV.search=true;OV.menu=false;OV.sq='';renderOverlay()}
  else if(a==='ov-close'){closeOv()}
  else if(a==='goto'){var r=t.dataset.r;UI.q=(r==='arabic'||r==='library')?t.dataset.q:'';UI.stage='الكل';UI.topic='الكل';UI.kind='الكل';OV.search=false;if(location.hash==='#'+r){renderAll()}else{location.hash=r}}
  else if(a==='filter'){UI[t.dataset.g]=t.dataset.v;(cur==='arabic'?renderArabic:renderLibrary)()}
  else if(a==='read'){OV.read=t.dataset.id;renderOverlay()}
  else if(a==='copy'){copyText(t.dataset.text||location.href,t.dataset.msg||'تم النسخ')}
  else if(a==='daily'){dailyPick(+t.dataset.i)}
  else if(a==='quiz-start'){quizStart()}
  else if(a==='quiz-pick'){quizPick(+t.dataset.i)}
  else if(a==='quiz-next'){quizNext()}
  else if(a==='admin-open'){openAdmin()}
  else if(a==='dl-site'){downloadSite()}
  else if(a==='edit-on'){setEdit(true)}
  else if(a==='edit-off'){setEdit(false)}
  else if(a==='ed-save'){saveEd()}
  else if(a==='ed-reset'){resetEd()}
  else if(a==='ed-cancel'){ED=null;renderFab()}
  else if(a==='admin-close'){AD.open=false;AD.form=null;history.replaceState(null,'','#'+(cur==='home'?'home':cur));renderAdmin();renderFooter()}
  else if(a==='admin-tab'){openAdmin(t.dataset.tab,null)}
  else if(a==='item-add'){openAdmin(COL2TAB[t.dataset.col],{col:t.dataset.col,id:null})}
  else if(a==='item-edit'){AD.form={col:t.dataset.col,id:t.dataset.id};renderAdmin()}
  else if(a==='form-cancel'){AD.form=null;renderAdmin()}
  else if(a==='item-del'){AD.del=t.dataset.col+':'+t.dataset.id;renderAdmin()}
  else if(a==='del-cancel'){AD.del=null;renderAdmin()}
  else if(a==='item-del2'){var c=t.dataset.col,id=t.dataset.id;commit(function(d){d[c]=d[c].filter(function(x){return x.id!==id})},'تم الحذف')}
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='sq'){OV.sq=t.value;doSearch(t.value)}
  else if(t.id==='lq'){UI.q=t.value;cur==='arabic'?fillArabic():fillLibrary()}
});
document.addEventListener('change',function(e){if(e.target.dataset&&e.target.dataset.up)upload(e.target)});
document.addEventListener('submit',function(e){
  var f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();
  if(f.dataset.form==='hsearch'){var q=$('#hq').value;OV.search=true;OV.sq=q;renderOverlay()}
  else if(f.dataset.form==='save'){saveForm(f)}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(OV.menu||OV.search||OV.read)closeOv()}});


/* ---------- editable texts ---------- */
var EDIT=false,ED=null,seen=new WeakSet();
var EDZ='#hdr,#notice,#view,#ftr,#ovl',SKIP='#adm,#toast,script,style,textarea,option,select,.card,.li,details.d,.sr,.arow,.reader,#quiz,#daily,#player,.word,.cnt,[data-nt]';
function hasT(o){return Object.prototype.hasOwnProperty.call(data.texts||{},o)}
function applyTexts(){
  var T=data.texts||{};if(!EDIT&&!Object.keys(T).length)return;
  $$(EDZ).forEach(function(root){
    var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null),list=[],n;
    while((n=w.nextNode()))list.push(n);
    list.forEach(function(n){
      if(seen.has(n))return;var p=n.parentElement;if(!p||p.closest(SKIP))return;
      var o=n.nodeValue.trim();if(!o)return;seen.add(n);
      var v=hasT(o)?T[o]:o;
      if(EDIT){var sp=document.createElement('span');sp.className='ed';sp.dataset.o=o;sp.textContent=v;seen.add(sp.firstChild);n.parentNode.replaceChild(sp,n)}
      else if(v!==o)n.nodeValue=n.nodeValue.replace(o,v)})})}
var sched=0;function schedule(){if(sched)return;sched=1;setTimeout(function(){sched=0;applyTexts()},0)}
function watch(){try{new MutationObserver(schedule).observe($('#app'),{childList:true,subtree:true,characterData:true})}catch(e){}}
function renderFab(){var el=$('#fabw');if(!el)return;var h='';
  if(EDIT){h+='<div class="ebar"><span>وضع تعديل النصوص: اضغط أي نص لتعديله</span><label class="vh" for="epage">الصفحة</label><select id="epage"><option value="home">الرئيسية</option>'+ROUTES.map(function(r){return '<option value="'+r.id+'"'+(cur===r.id?' selected':'')+'>'+r.nav+'</option>'}).join('')+'</select><button class="btn gold sm" data-act="edit-off">إنهاء</button></div>'}
  else if(ADMIN&&!AD.open){h+='<div class="fabs"><button class="btn line on-navy sm" style="background:rgba(7,20,51,.85)" data-act="edit-on">تعديل النصوص</button><button class="btn gold" data-act="admin-open">لوحة التحكم</button></div>'}
  if(ED){h+='<div class="emod" role="dialog" aria-label="تعديل نص"><div class="emod-in"><h3 style="font-size:26px;margin-bottom:14px">تعديل النص</h3><div class="fld"><label for="etx">النص</label><textarea id="etx" rows="'+Math.min(10,Math.max(3,Math.ceil(ED.v.length/38)))+'">'+esc(ED.v)+'</textarea></div>'+(ED.o!==ED.v?'<p class="soft" style="margin-bottom:10px">النص الأصلي: '+esc(ED.o)+'</p>':'')+'<div class="row" style="flex-wrap:wrap"><button class="btn gold" data-act="ed-save">حفظ</button>'+(hasT(ED.o)?'<button class="btn line" data-act="ed-reset">استعادة الأصل</button>':'')+'<button class="btn line" data-act="ed-cancel">إلغاء</button></div></div></div>'}
  el.innerHTML=h;if(ED){var t=$('#etx');if(t)t.focus()}}
function openEd(o){ED={o:o,v:hasT(o)?data.texts[o]:o};renderFab()}
function saveEd(){var val=($('#etx').value||'').trim();if(!val){toast('اكتب نصًا قبل الحفظ');return}var o=ED.o;ED=null;
  commit(function(d){d.texts=d.texts||{};if(val===o)delete d.texts[o];else d.texts[o]=val},'تم حفظ النص')}
function resetEd(){var o=ED.o;ED=null;commit(function(d){d.texts=d.texts||{};delete d.texts[o]},'تمت استعادة النص الأصلي')}
function setEdit(on){EDIT=on;ED=null;AD.open=false;AD.form=null;if(location.hash.indexOf('#admin')===0)history.replaceState(null,'','#'+cur);seen=new WeakSet();renderAll();if(on)toast('اضغط أي نص في الصفحة لتعديله')}
document.addEventListener('click',function(e){
  if(!EDIT)return;var z=e.target.closest(EDZ);if(!z)return;
  e.preventDefault();e.stopPropagation();var sp=e.target.closest('.ed');if(sp)openEd(sp.dataset.o)},true);
document.addEventListener('change',function(e){if(e.target.id==='epage'){var v=e.target.value;if(location.hash==='#'+v){renderAll()}else location.hash=v}});

/* ---------- boot ---------- */
function initCaps(){
  var c=window.claude;
  if(!c||!c.use){CAPS=true;ADMIN=!!store.get('ds_owner',0)||!/^https?:$/.test(location.protocol);renderAll();return}
  var get=function(n){return Promise.resolve().then(function(){return c.use(n)}).catch(function(){return null})};
  Promise.all([get('artifact'),get('user'),get('assets')]).then(function(r){
    ART=r[0];USR=r[1];ASSETS=r[2];CAPS=true;
    ADMIN=!!ART&&!!USR&&!!(safe(function(){return USR.isOwner()},false)||safe(function(){return USR.canEdit()},false));
    renderAll()})}
function start(prev){
  try{document.documentElement.style.setProperty('--logo','url('+IMG.logoT+')')}catch(e){}
  if(prev&&prev.ui)Object.assign(UI,prev.ui);
  try{parseHash()}catch(e){cur='home'}
  renderAll();watch();initCaps()}
var hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot)hot.snapshot(function(){return{ui:UI}});
if(hot&&hot.ready)hot.ready(start);else start(hot&&hot.data?hot.data:{});
})();
</script></body></html>
